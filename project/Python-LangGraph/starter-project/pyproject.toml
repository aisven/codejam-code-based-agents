[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools==84.0.0"]


[project]
name = "starter-project"
dynamic = ["version"]
description = "An SAP CodeJam considering Agentic AI."
authors = [
  {name = "Miki"},
  {name = "Sven"},
]
maintainers = [
  {name = "Miki"},
  {name = "Sven"},
]
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "langgraph==1.2.12",
    "langchain-core==1.6.5",
    "langchain-litellm==0.10.0",
    "litellm==1.103.0",
    "python-dotenv==1.2.3",
]


[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
]
test = [
    "pytest==9.1.1",
    "pytest-order==1.5.0",
    "pytest-sugar==1.1.1",
    "pytest-cov==7.1.0",
]
#load = [
#    "locust==2.44.0",
#    "locust-plugins[dashboards]==5.0.0",
#]


[tool.setuptools.dynamic]
version = {attr = "starter_project.__version__"}


[tool.setuptools.packages.find]
where = ["."]
include = ["starter_project*"]
namespaces = false


[tool.ruff]
target-version = "py314"
line-length = 160
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "protobuf",
    ".proto",
]


[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []


## the pytest option -s disables the capturing of stdout and stderr so that they work normally
## for alternative options see https://docs.pytest.org/en/7.1.x/how-to/capture-stdout-stderr.html
[tool.pytest.ini_options]
minversion = "9.1"
pythonpath = [
  "."
]
addopts = "-vv -s"
# asyncio_mode = "strict"
